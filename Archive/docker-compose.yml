services:
  api:
    build:
      context: ./api
    command: >
      sh -c "touch .env
      && grep -q '^DB_CONNECTION=' .env || {
        echo DB_CONNECTION=pgsql >> .env;
        echo DB_HOST=$$DB_HOST >> .env;
        echo DB_PORT=$$DB_PORT >> .env;
        echo DB_DATABASE=$$DB_DATABASE >> .env;
        echo DB_USERNAME=$$DB_USERNAME >> .env;
        echo DB_PASSWORD=$$DB_PASSWORD >> .env;
        echo EMBEDDING_SERVICE_URL=$$EMBEDDING_SERVICE_URL >> .env;
      }
      && php artisan serve --host=0.0.0.0 --port=8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-guised_up}
      DB_USERNAME: ${DB_USERNAME:-guised_up}
      DB_PASSWORD: ${DB_PASSWORD:-guised_up_password}
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      embedding-service:
        condition: service_started

  embedding-service:
    build:
      context: ./embedding-service
    environment:
      EMBEDDING_MODE: ${EMBEDDING_MODE:-fallback}
      EMBEDDING_ALLOW_FALLBACK_ON_FAILURE: ${EMBEDDING_ALLOW_FALLBACK_ON_FAILURE:-true}
    ports:
      - "${EMBEDDING_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-guised_up}
      POSTGRES_USER: ${DB_USERNAME:-guised_up}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guised_up_password}
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-guised_up} -d ${DB_DATABASE:-guised_up}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  api_vendor:
